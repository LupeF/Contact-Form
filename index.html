<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Big+Shoulders:opsz,wght@10..72,100..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Lexend+Deca&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet"> 
  <title>Frontend Mentor | Contact form</title>

</head>
<body>
  
<main>
  <form method="get">
    <h2>Contact Us</h2>
    <div class="form-flex">
      <label for="firstName">First name* 
        <input type="text" name="firstName" id="firstName" aria-label="This field is required" aria-required="true">
        <span>This field is required</span>
      </label>
      <label for="lastName">Last Name*
        <input type="text" name="" id="lastName" >
        <span>This field is required</span>
      </label>
    </div>
  
    <label for="email">Email Address*
      <input type="email" id="email">
      <span>Please enter a valid email address</span>
    </label>

    <label for="radio-One">Query type*
      <div class="form-flex">
        <div class="query-option">
          <input class="query-input" type="radio" name="query" id="radio-One">
          <div class="flex">
            <p>General Enquiry</p>
          </div>
        </div>
        <div class="query-option">
          <input class="query-input" type="radio" name="query" id="radio-two">
          <div class="flex">
            <p>Support Request</p> 
          </div>
        </div>
      </div>
      <span>Please select a query type </span>
    </label>
  

    <label for="textArea">Message*
      <textarea name="textArea" id="text-Area" rows="8" cols="8" id="textArea"></textarea>
      <span>This field is required</span>
    </label>
    <div class=" flex consent">
      <p>I consent to being contacted by the team * </p>  
      <input type="checkbox" name="checkbox" id="checkbox"> 
      <span>To submit this form, please consent to being contacted</span>
    </div>
 
    <button type="submit" id="submitBtn">Submit</button>
    
  </form>
</main>
<div id="overlay-container">
  <div id="overlay">
    <div id="success-header">
      <img src="assets/images/icon-success-check.svg" alt="success icon">
      <h3>Message Sent!</h3>
    </div>
    <p> Thanks for completing the form. We'll be in touch soon!</p>
  </div>
</div>
  
  <script src="js/script.js"></script>
</body>
